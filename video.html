
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0B0B">

  <meta name="description"
        content="Videography, film editing, interviews, corporate video production and livestreaming by Wilson Unique Studios in Trinidad and Tobago.">

  <meta property="og:type" content="website">
  <meta property="og:title"
        content="Videography & Live Streaming | Wilson Unique Studios">
  <meta property="og:description"
        content="Event films, corporate videos, interviews and livestreaming by Wilson Unique Studios.">

  <title>Videography & Live Streaming | Wilson Unique Studios</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@600;700;800&amp;display=swap"
        rel="stylesheet">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css"
        rel="stylesheet">

  <link href="css/style.css?v=3.0" rel="stylesheet">
  <script src="js/main.js?v=3.0" defer></script>

  <style>
    .video-feature-section {
      background: #0B0B0B;
      color: #F7F4EE;
    }

    .video-feature-section h2 {
      margin-bottom: 20px;
    }

    .video-description {
      max-width: 750px;
      color: #D9D9D9;
      margin-bottom: 30px;
    }

    .video-player-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    .video-player-wrap iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-feature-section .button-link.outline {
      color: #F7F4EE;
      border-color: #F7F4EE;
      margin-top: 25px;
    }

    .service-grid .card-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .service-grid .card-photo img.livestream-image {
      object-fit: contain;
      background: #0B0B0B;
    }

    .about-photo img.livestream-work-photo {
      display: block;
      width: 100%;
      height: 480px;
      object-fit: contain;
      object-position: center;
      background: #0B0B0B;
      mix-blend-mode: normal;
    }

    @media (max-width: 850px) {
      .about-photo img.livestream-work-photo {
        height: 350px;
      }
    }

    @media (max-width: 600px) {
      .about-photo img.livestream-work-photo {
        height: 270px;
      }
    }
  </style>
</head>
